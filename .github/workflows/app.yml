name: Appli mobile LotoLabo

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test (achats simulés) ou store (achats réels)"
        default: "test"
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]

permissions:
  contents: write

concurrency:
  group: appli-mobile
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Clé de signature de test (gardée d'une version à l'autre)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lotolabo-debug-keystore-v1
      - name: Projet Capacitor Android
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          node make-www.mjs "${{ inputs.mode || 'test' }}"
          node make-assets.mjs
          npx cap add android
          npx capacitor-assets generate --android
          node patch-native.mjs android
          npx cap sync android
      - name: Compiler l'APK
        working-directory: app/android
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.9.${{ github.run_number }}\"/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/LotoLabo-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LotoLabo-android
          path: LotoLabo-test.apk
      - name: Lien de téléchargement pour les testeurs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "Version test Android de LotoLabo (n° 0.9.${{ github.run_number }})." "" "Installation : ouvre ce lien sur ton téléphone Android, télécharge LotoLabo-test.apk, puis ouvre le fichier et autorise l'installation." "Pendant le test, LotoLabo+ se débloque gratuitement : rien n'est facturé." > notes.txt
          gh release view test >/dev/null 2>&1 || gh release create test --title "LotoLabo — version test" --notes-file notes.txt --prerelease
          gh release edit test --notes-file notes.txt
          gh release upload test LotoLabo-test.apk --clobber
      - name: Version Google Play (fichier AAB signé, achats et pubs réels)
        if: env.KS_B64 != ''
        working-directory: app
        run: |
          node make-www.mjs store
          npx cap sync android
          cd android
          ./gradlew bundleRelease --no-daemon -q
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -signedjar "$GITHUB_WORKSPACE/LotoLabo-play-store.aab" app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: env.KS_B64 != ''
        with:
          name: LotoLabo-play-store
          path: LotoLabo-play-store.aab

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Xcode le plus récent
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "$X"; sudo xcode-select -s "$X"
      - name: Projet Capacitor iOS
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          node make-www.mjs "${{ inputs.mode || 'test' }}"
          node make-assets.mjs
          npx cap add ios
          npx capacitor-assets generate --ios
          node patch-native.mjs ios
          npx cap sync ios
      - name: Compiler pour le simulateur (contrôle, sans signature)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
          cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/LotoLabo-simulateur.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: LotoLabo-ios-simulateur
          path: LotoLabo-simulateur.zip
